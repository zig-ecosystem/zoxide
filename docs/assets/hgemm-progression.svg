<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" font-family="Menlo, monospace">
  <rect width="880" height="390" fill="#0d1117"/>
  <text x="440" y="34" fill="#e6edf3" font-size="18" text-anchor="middle" font-weight="bold">zoxide HGEMM on NVIDIA H20 — % of FP16 tensor peak (~148 TFLOPS)</text>
  <text x="440" y="54" fill="#6e7681" font-size="12" text-anchor="middle">n=4096, best of 10 — every variant exact (max err 0)</text>
  <line x1="70" y1="300" x2="600" y2="300" stroke="#30363d" stroke-width="1"/>
  <!-- bars: height = pct * 4 (baseline y=300) -->
  <!-- 50% marker: the target the mma.sync line did not reach -->
  <line x1="70" y1="100" x2="600" y2="100" stroke="#484f58" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="64" y="104" fill="#6e7681" font-size="11" text-anchor="end">50%</text>
  <!-- hgemm_mma 24.9% -->
  <rect x="110" y="200.4" width="100" height="99.6" fill="#8b949e"/>
  <text x="160" y="192" fill="#8b949e" font-size="14" text-anchor="middle">24.9%</text>
  <text x="160" y="322" fill="#c9d1d9" font-size="12" text-anchor="middle">hgemm_mma</text>
  <text x="160" y="340" fill="#6e7681" font-size="11" text-anchor="middle">36.8 TF</text>
  <text x="160" y="358" fill="#6e7681" font-size="11" text-anchor="middle">mma.sync m16n8k16</text>
  <text x="160" y="372" fill="#6e7681" font-size="11" text-anchor="middle">warp-level</text>
  <!-- hgemm_mma2 36.4% -->
  <rect x="280" y="154.4" width="100" height="145.6" fill="#79c0ff"/>
  <text x="330" y="146" fill="#79c0ff" font-size="14" text-anchor="middle">36.4%</text>
  <text x="330" y="322" fill="#c9d1d9" font-size="12" text-anchor="middle">hgemm_mma2</text>
  <text x="330" y="340" fill="#6e7681" font-size="11" text-anchor="middle">53.8 TF</text>
  <text x="330" y="358" fill="#6e7681" font-size="11" text-anchor="middle">+ ldmatrix / cp.async</text>
  <text x="330" y="372" fill="#6e7681" font-size="11" text-anchor="middle">128×128 tile</text>
  <!-- hgemm_wgmma 54.3% -->
  <rect x="450" y="82.8" width="100" height="217.2" fill="#f0b72f"/>
  <text x="500" y="74" fill="#f0b72f" font-size="14" text-anchor="middle" font-weight="bold">54.3%</text>
  <text x="500" y="322" fill="#e6edf3" font-size="12" text-anchor="middle" font-weight="bold">hgemm_wgmma</text>
  <text x="500" y="340" fill="#6e7681" font-size="11" text-anchor="middle">80.3 TF</text>
  <text x="500" y="358" fill="#6e7681" font-size="11" text-anchor="middle">wgmma.mma_async</text>
  <text x="500" y="372" fill="#6e7681" font-size="11" text-anchor="middle">m64n16k16, warpgroup</text>
  <!-- speedup callout between the last two bars -->
  <text x="415" y="120" fill="#f0b72f" font-size="13" text-anchor="middle" font-weight="bold">1.49x</text>
  <!-- right-hand notes -->
  <g font-size="12">
    <text x="626" y="118" fill="#c9d1d9">warpgroup MMA: both operands</text>
    <text x="626" y="136" fill="#c9d1d9">read async from shared memory</text>
    <text x="626" y="154" fill="#c9d1d9">via 64-bit descriptors</text>
    <text x="626" y="192" fill="#8b949e">no LLVM intrinsic exists —</text>
    <text x="626" y="210" fill="#8b949e">hand-written inline asm, sm_90a</text>
    <text x="626" y="248" fill="#f0b72f">still capped at n16: Zig allows</text>
    <text x="626" y="266" fill="#f0b72f">only 15 asm outputs, and</text>
    <text x="626" y="284" fill="#f0b72f">m64n32k16 needs 16 registers</text>
  </g>
</svg>
