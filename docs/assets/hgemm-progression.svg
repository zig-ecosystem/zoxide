<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Menlo, monospace">
  <rect width="980" height="430" fill="#0d1117"/>
  <text x="490" y="30" fill="#e6edf3" font-size="17" text-anchor="middle" font-weight="bold">zoxide HGEMM on NVIDIA H20 — % of FP16 tensor peak (~148 TFLOPS)</text>
  <text x="490" y="50" fill="#6e7681" font-size="12" text-anchor="middle">n=4096, best of 10 — every variant exact (max err 0)</text>
  <line x1="70" y1="330" x2="690" y2="330" stroke="#30363d" stroke-width="1"/>
  <!-- bars: height = pct * 3.5, baseline 330 -->
  <line x1="70" y1="155" x2="690" y2="155" stroke="#484f58" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="64" y="159" fill="#6e7681" font-size="11" text-anchor="end">50%</text>
  <!-- 24.8 -->
  <rect x="95" y="243.2" width="85" height="86.8" fill="#8b949e"/>
  <text x="137" y="234" fill="#8b949e" font-size="13" text-anchor="middle">24.8%</text>
  <text x="137" y="352" fill="#c9d1d9" font-size="11" text-anchor="middle">hgemm_mma</text>
  <text x="137" y="369" fill="#6e7681" font-size="10" text-anchor="middle">36.7 TF</text>
  <text x="137" y="384" fill="#6e7681" font-size="10" text-anchor="middle">mma.sync</text>
  <text x="137" y="398" fill="#6e7681" font-size="10" text-anchor="middle">warp-level</text>
  <!-- 36.8 -->
  <rect x="215" y="201.2" width="85" height="128.8" fill="#79c0ff"/>
  <text x="257" y="192" fill="#79c0ff" font-size="13" text-anchor="middle">36.8%</text>
  <text x="257" y="352" fill="#c9d1d9" font-size="11" text-anchor="middle">hgemm_mma2</text>
  <text x="257" y="369" fill="#6e7681" font-size="10" text-anchor="middle">54.5 TF</text>
  <text x="257" y="384" fill="#6e7681" font-size="10" text-anchor="middle">+ ldmatrix</text>
  <text x="257" y="398" fill="#6e7681" font-size="10" text-anchor="middle">+ cp.async</text>
  <!-- 58.3 wgmma -->
  <rect x="335" y="125.9" width="85" height="204.1" fill="#d29922"/>
  <text x="377" y="117" fill="#d29922" font-size="13" text-anchor="middle">58.3%</text>
  <text x="377" y="352" fill="#c9d1d9" font-size="11" text-anchor="middle">hgemm_wgmma</text>
  <text x="377" y="369" fill="#6e7681" font-size="10" text-anchor="middle">86.3 TF</text>
  <text x="377" y="384" fill="#6e7681" font-size="10" text-anchor="middle">wgmma m64n16k16</text>
  <text x="377" y="398" fill="#6e7681" font-size="10" text-anchor="middle">2-stage</text>
  <!-- 58.3 wgmma2 -->
  <rect x="455" y="125.9" width="85" height="204.1" fill="#8b949e"/>
  <text x="497" y="117" fill="#8b949e" font-size="13" text-anchor="middle">58.3%</text>
  <text x="497" y="352" fill="#8b949e" font-size="11" text-anchor="middle">hgemm_wgmma2</text>
  <text x="497" y="369" fill="#6e7681" font-size="10" text-anchor="middle">86.3 TF</text>
  <text x="497" y="384" fill="#6e7681" font-size="10" text-anchor="middle">3-stage pipeline</text>
  <text x="497" y="398" fill="#f85149" font-size="10" text-anchor="middle">no gain</text>
  <!-- 64.4 -->
  <rect x="575" y="104.6" width="85" height="225.4" fill="#f0b72f"/>
  <text x="617" y="96" fill="#f0b72f" font-size="13" text-anchor="middle" font-weight="bold">64.4%</text>
  <text x="617" y="352" fill="#e6edf3" font-size="11" text-anchor="middle" font-weight="bold">hgemm_wgmma3</text>
  <text x="617" y="369" fill="#6e7681" font-size="10" text-anchor="middle">95.3 TF</text>
  <text x="617" y="384" fill="#6e7681" font-size="10" text-anchor="middle">A from registers</text>
  <text x="617" y="398" fill="#6e7681" font-size="10" text-anchor="middle">(wgmma RS)</text>
  <!-- deltas -->
  <text x="197" y="225" fill="#79c0ff" font-size="10" text-anchor="middle" font-weight="bold">+12.0</text>
  <text x="317" y="170" fill="#d29922" font-size="10" text-anchor="middle" font-weight="bold">+21.5</text>
  <text x="437" y="140" fill="#f85149" font-size="10" text-anchor="middle" font-weight="bold">0.0</text>
  <text x="557" y="118" fill="#f0b72f" font-size="10" text-anchor="middle" font-weight="bold">+6.1</text>
  <!-- notes -->
  <g font-size="12">
    <text x="712" y="100" fill="#c9d1d9">1.74x over the tuned</text>
    <text x="712" y="118" fill="#c9d1d9">mma.sync baseline</text>
    <text x="712" y="152" fill="#8b949e">no LLVM intrinsic for</text>
    <text x="712" y="170" fill="#8b949e">wgmma.mma_async — hand-</text>
    <text x="712" y="188" fill="#8b949e">written inline asm, sm_90a</text>
    <text x="712" y="222" fill="#f85149">the 3-stage pipeline was</text>
    <text x="712" y="240" fill="#f85149">first credited with +4.1pp.</text>
    <text x="712" y="258" fill="#f85149">It was a 1-byte local store</text>
    <text x="712" y="276" fill="#f85149">in the loop, worth 7.3% of</text>
    <text x="712" y="294" fill="#f85149">throughput on its own. The</text>
    <text x="712" y="312" fill="#f85149">pipeline itself: 0.0pp.</text>
    <text x="712" y="346" fill="#6e7681">still capped at n16 by Zig's</text>
    <text x="712" y="364" fill="#6e7681">15-output inline asm limit</text>
  </g>
</svg>
