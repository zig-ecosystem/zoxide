<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Menlo, monospace">
  <rect width="880" height="400" fill="#0d1117"/>
  <text x="440" y="32" fill="#e6edf3" font-size="17" text-anchor="middle" font-weight="bold">hgemm_wgmma3 on H20 — register cap vs throughput</text>
  <text x="440" y="52" fill="#6e7681" font-size="12" text-anchor="middle">more occupancy is not better, and spilling is catastrophic</text>
  <line x1="70" y1="320" x2="620" y2="320" stroke="#30363d" stroke-width="1"/>
  <!-- bars: height = pct * 3.8, baseline 320 -->
  <!-- uncapped 64.3 -->
  <rect x="95" y="75.7" width="70" height="244.3" fill="#f0b72f"/>
  <text x="130" y="67" fill="#f0b72f" font-size="12" text-anchor="middle" font-weight="bold">64.3%</text>
  <text x="130" y="340" fill="#e6edf3" font-size="11" text-anchor="middle" font-weight="bold">uncapped</text>
  <text x="130" y="357" fill="#8b949e" font-size="10" text-anchor="middle">98 regs</text>
  <text x="130" y="371" fill="#8b949e" font-size="10" text-anchor="middle">4 blk / 25%</text>
  <text x="130" y="387" fill="#56d364" font-size="10" text-anchor="middle">no spill</text>
  <!-- 104 -->
  <rect x="185" y="74.5" width="70" height="245.5" fill="#d29922"/>
  <text x="220" y="66" fill="#d29922" font-size="12" text-anchor="middle">64.6%</text>
  <text x="220" y="340" fill="#c9d1d9" font-size="11" text-anchor="middle">cap 104</text>
  <text x="220" y="357" fill="#8b949e" font-size="10" text-anchor="middle">100 regs</text>
  <text x="220" y="371" fill="#8b949e" font-size="10" text-anchor="middle">4 blk / 25%</text>
  <text x="220" y="387" fill="#56d364" font-size="10" text-anchor="middle">no spill</text>
  <!-- 96 -->
  <rect x="275" y="83.3" width="70" height="236.7" fill="#bb8009"/>
  <text x="310" y="74" fill="#bb8009" font-size="12" text-anchor="middle">62.3%</text>
  <text x="310" y="340" fill="#c9d1d9" font-size="11" text-anchor="middle">cap 96</text>
  <text x="310" y="357" fill="#8b949e" font-size="10" text-anchor="middle">94 regs</text>
  <text x="310" y="371" fill="#79c0ff" font-size="10" text-anchor="middle">5 blk / 31%</text>
  <text x="310" y="387" fill="#56d364" font-size="10" text-anchor="middle">no spill</text>
  <!-- 88 -->
  <rect x="365" y="185.9" width="70" height="134.1" fill="#8b949e"/>
  <text x="400" y="177" fill="#8b949e" font-size="12" text-anchor="middle">35.3%</text>
  <text x="400" y="340" fill="#c9d1d9" font-size="11" text-anchor="middle">cap 88</text>
  <text x="400" y="357" fill="#8b949e" font-size="10" text-anchor="middle">88 regs</text>
  <text x="400" y="371" fill="#79c0ff" font-size="10" text-anchor="middle">5 blk / 31%</text>
  <text x="400" y="387" fill="#f85149" font-size="10" text-anchor="middle">64 B spill</text>
  <!-- 80 -->
  <rect x="455" y="224.2" width="70" height="95.8" fill="#6e7681"/>
  <text x="490" y="215" fill="#6e7681" font-size="12" text-anchor="middle">25.2%</text>
  <text x="490" y="340" fill="#c9d1d9" font-size="11" text-anchor="middle">cap 80</text>
  <text x="490" y="357" fill="#8b949e" font-size="10" text-anchor="middle">80 regs</text>
  <text x="490" y="371" fill="#79c0ff" font-size="10" text-anchor="middle">6 blk / 38%</text>
  <text x="490" y="387" fill="#f85149" font-size="10" text-anchor="middle">128 B spill</text>
  <!-- 72 -->
  <rect x="545" y="248.6" width="70" height="71.4" fill="#57606a"/>
  <text x="580" y="240" fill="#6e7681" font-size="12" text-anchor="middle">18.8%</text>
  <text x="580" y="340" fill="#c9d1d9" font-size="11" text-anchor="middle">cap 72</text>
  <text x="580" y="357" fill="#8b949e" font-size="10" text-anchor="middle">72 regs</text>
  <text x="580" y="371" fill="#79c0ff" font-size="10" text-anchor="middle">7 blk / 44%</text>
  <text x="580" y="387" fill="#f85149" font-size="10" text-anchor="middle">192 B spill</text>
  <!-- annotations -->
  <text x="646" y="100" fill="#c9d1d9" font-size="12">the cap-96 line is the</text>
  <text x="646" y="118" fill="#c9d1d9" font-size="12">whole result: zero spill,</text>
  <text x="646" y="136" fill="#c9d1d9" font-size="12">occupancy 25% -&gt; 31%,</text>
  <text x="646" y="154" fill="#f0b72f" font-size="12" font-weight="bold">throughput down 3%</text>
  <text x="646" y="186" fill="#8b949e" font-size="12">4 blocks already hide</text>
  <text x="646" y="204" fill="#8b949e" font-size="12">the latency — occupancy</text>
  <text x="646" y="222" fill="#8b949e" font-size="12">was never the constraint</text>
  <text x="646" y="254" fill="#f85149" font-size="12">16 spilled registers</text>
  <text x="646" y="272" fill="#f85149" font-size="12">costs 45% of throughput;</text>
  <text x="646" y="290" fill="#f85149" font-size="12">48 costs 71%. Results</text>
  <text x="646" y="308" fill="#f85149" font-size="12">stay exact throughout —</text>
  <text x="646" y="326" fill="#f85149" font-size="12">purely a perf failure</text>
</svg>
