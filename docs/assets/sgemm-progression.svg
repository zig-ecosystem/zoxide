<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Menlo, monospace">
  <rect width="720" height="360" fill="#0d1117"/>
  <text x="360" y="36" fill="#e6edf3" font-size="18" text-anchor="middle" font-weight="bold">zoxide SGEMM on NVIDIA H20 — % of FP32 peak (~44 TFLOPS)</text>
  <line x1="110" y1="300" x2="690" y2="300" stroke="#30363d" stroke-width="1"/>
  <!-- bars: height = pct * 5 (50% -> 250px max), baseline y=300 -->
  <!-- naive 6.3% -->
  <rect x="140" y="268.5" width="70" height="31.5" fill="#8b949e"/>
  <text x="175" y="260" fill="#8b949e" font-size="13" text-anchor="middle">6.3%</text>
  <text x="175" y="322" fill="#8b949e" font-size="12" text-anchor="middle">naive</text>
  <text x="175" y="338" fill="#6e7681" font-size="11" text-anchor="middle">2.8 TF</text>
  <!-- tiled 9.9% -->
  <rect x="260" y="250.5" width="70" height="49.5" fill="#79c0ff"/>
  <text x="295" y="242" fill="#79c0ff" font-size="13" text-anchor="middle">9.9%</text>
  <text x="295" y="322" fill="#8b949e" font-size="12" text-anchor="middle">tiled 32×32</text>
  <text x="295" y="338" fill="#6e7681" font-size="11" text-anchor="middle">4.4 TF</text>
  <!-- reg 34.8% -->
  <rect x="380" y="126" width="70" height="174" fill="#56d364"/>
  <text x="415" y="118" fill="#56d364" font-size="13" text-anchor="middle">34.8%</text>
  <text x="415" y="322" fill="#8b949e" font-size="12" text-anchor="middle">reg 8×8 FMA</text>
  <text x="415" y="338" fill="#6e7681" font-size="11" text-anchor="middle">15.3 TF</text>
  <!-- swz 42.8% -->
  <rect x="500" y="86" width="70" height="214" fill="#f0b72f"/>
  <text x="535" y="78" fill="#f0b72f" font-size="13" text-anchor="middle" font-weight="bold">42.8%</text>
  <text x="535" y="322" fill="#8b949e" font-size="12" text-anchor="middle">swz no-conflict</text>
  <text x="535" y="338" fill="#6e7681" font-size="11" text-anchor="middle">18.8 TF</text>
  <!-- annotations -->
  <text x="585" y="140" fill="#6e7681" font-size="11">+FMA (@mulAdd)</text>
  <text x="585" y="156" fill="#6e7681" font-size="11">+register blocking</text>
  <text x="585" y="60" fill="#6e7681" font-size="11">+bank-conflict-free</text>
  <text x="585" y="76" fill="#6e7681" font-size="11">column remap</text>
</svg>
