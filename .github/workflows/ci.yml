name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build host CLI
        run: zig build

      - name: Host unit tests
        run: zig build test
      - name: Build example kernels (PTX)
        run: zig build kernels

      - name: Assert PTX invariants
        run: |
          set -euo pipefail
          cd zig-out/kernels
          for f in *.ptx; do
            grep -q '\.entry' "$f" || { echo "$f: missing .entry"; exit 1; }
            if grep -q '\$0' "$f"; then echo "$f: unsubstituted \$0 placeholder"; exit 1; fi
          done
          grep -q '\.shared' shared_reverse.ptx
          grep -q 'shfl\.sync' warp_reduce.ptx
          grep -q 'vote\.sync\.ballot' intrinsics_smoke.ptx
          grep -q 'cp\.async\.ca\.shared\.global' intrinsics_smoke.ptx
          grep -q '\.shared' sgemm_tiled.ptx
          grep -q 'st\.shared' sgemm_tiled.ptx
          grep -q 'ld\.shared' sgemm_tiled.ptx
          # Regression guard for the real-GPU deadlock (docs/verification.md):
          # atomic_counter's bar.sync must not be duplicated onto divergent
          # paths — exactly 2 sites, both before the first conditional branch.
          test "$(grep -c 'bar\.sync' atomic_counter.ptx)" -eq 2
          first_bar=$(grep -n 'bar\.sync' atomic_counter.ptx | head -1 | cut -d: -f1)
          first_branch=$(grep -nE '@%p[0-9]+ bra' atomic_counter.ptx | head -1 | cut -d: -f1)
          [ "$first_bar" -lt "$first_branch" ] || { echo "atomic_counter: bar.sync after branch"; exit 1; }
          # sgemm_tiled: the tile loop must keep exactly 2 bar.sync sites
          # (one after tile load, one after the dot-product loop).
          test "$(grep -c 'bar\.sync' sgemm_tiled.ptx)" -eq 2
          # sgemm_reg: FMA must be emitted (register-blocked inner loop) and
          # the tile loop must keep exactly 2 bar.sync sites.
          test "$(grep -c 'fma\.rn\.f32' sgemm_reg.ptx)" -ge 64
          test "$(grep -c 'bar\.sync' sgemm_reg.ptx)" -eq 2
          grep -q '\.shared' sgemm_reg.ptx
          # sgemm_opt / sgemm_opt2: vectorized (128-bit) global->shared loads.
          grep -qE 'ld\.global\.(v4|v2\.b64)' sgemm_opt.ptx
          grep -qE 'ld\.global\.(v4|v2\.b64)' sgemm_opt2.ptx
          grep -qE 'st\.shared\.(v4|v2\.b64)' sgemm_opt.ptx
          test "$(grep -c 'fma\.rn\.f32' sgemm_opt.ptx)" -ge 64
          test "$(grep -c 'fma\.rn\.f32' sgemm_opt2.ptx)" -ge 64
          test "$(grep -c 'bar\.sync' sgemm_opt.ptx)" -eq 2
          # opt2: prologue + 2 per tile loop iteration
          test "$(grep -c 'bar\.sync' sgemm_opt2.ptx)" -eq 3
          # sgemm_swz: conflict-free B fragments via two float4 chunks.
          grep -qE 'ld\.shared\.v4' sgemm_swz.ptx
          test "$(grep -c 'fma\.rn\.f32' sgemm_swz.ptx)" -ge 64
          test "$(grep -c 'bar\.sync' sgemm_swz.ptx)" -eq 2
          # debug_print: device printf lowers to a vprintf call with a
          # .global format string.
          grep -q 'vprintf' debug_print.ptx
          grep -q '\.global' debug_print.ptx
          # math_smoke: the fast tier of cuda.math (src/math.zig) must lower
          # to the single PTX approx instructions libdevice's __nv_fast_*
          # are built on, and the software tier must survive as ordinary
          # arithmetic (no unresolved __nv_* or llvm.* calls).
          grep -q 'sin\.approx\.f32' math_smoke.ptx
          grep -q 'cos\.approx\.f32' math_smoke.ptx
          grep -q 'lg2\.approx\.f32' math_smoke.ptx
          grep -q 'ex2\.approx\.f32' math_smoke.ptx
          grep -q 'tanh\.approx\.f32' math_smoke.ptx
          grep -q 'rsqrt\.approx\.f32' math_smoke.ptx
          grep -q 'sqrt\.rn\.f32' math_smoke.ptx
          grep -q 'max\.f32' math_smoke.ptx
          if grep -q '__nv_\|llvm\.' math_smoke.ptx; then
            echo "math_smoke: unresolved external math call"; exit 1
          fi
          # asm_smoke: asm-template bindings produce real registers
          # (no positional $N or %[ residue).
          grep -q 'abs\.bf16x2 %r' asm_smoke.ptx
          grep -q 'mul\.rn\.f32x2 %rd' asm_smoke.ptx
          grep -q 'prmt\.b32\.b4e' asm_smoke.ptx
          grep -q 'mma\.sync\.aligned\.m16n8k16' asm_smoke.ptx
          if grep -qE '\$[0-9]|%\[' asm_smoke.ptx; then echo "asm_smoke: unsubstituted operand"; exit 1; fi
          # hgemm_mma: real tensor-core mma instructions, no placeholder residue
          test "$(grep -c 'mma\.sync\.aligned\.m16n8k16' hgemm_mma.ptx)" -eq 8
          if grep -qE '\$[0-9]|%\[' hgemm_mma.ptx; then echo "hgemm_mma: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' hgemm_mma.ptx)" -eq 2
          # hgemm_mma2: ldmatrix + cp.async + mma all present
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x4' hgemm_mma2.ptx
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x2\.trans' hgemm_mma2.ptx
          grep -q 'cp\.async\.cg\.shared\.global' hgemm_mma2.ptx
          grep -q 'cp\.async\.wait_group' hgemm_mma2.ptx
          test "$(grep -c 'mma\.sync\.aligned\.m16n8k16' hgemm_mma2.ptx)" -eq 64
          if grep -qE '\$[0-9]|%\[' hgemm_mma2.ptx; then echo "hgemm_mma2: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' hgemm_mma2.ptx)" -eq 2
          # hgemm_bf16: bf16 mma shape over the same ldmatrix + cp.async
          # pipeline as hgemm_mma2.
          test "$(grep -c 'mma\.sync\.aligned\.m16n8k16\.row\.col\.f32\.bf16\.bf16\.f32' hgemm_bf16.ptx)" -eq 64
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x4' hgemm_bf16.ptx
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x2\.trans' hgemm_bf16.ptx
          grep -q 'cp\.async\.cg\.shared\.global' hgemm_bf16.ptx
          grep -q 'cp\.async\.wait_group' hgemm_bf16.ptx
          if grep -qE '\$[0-9]|%\[' hgemm_bf16.ptx; then echo "hgemm_bf16: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' hgemm_bf16.ptx)" -eq 2
          # imma_s8: int8 mma shape, s8 inputs and s32 accumulators. Same tiling
          # and cp.async pipeline as hgemm_bf16, so the counts match; the
          # difference is the B path, which has no ldmatrix (see the kernel doc
          # comment) and gathers bytes instead.
          test "$(grep -c 'mma\.sync\.aligned\.m16n8k32\.row\.col\.s32\.s8\.s8\.s32' imma_s8.ptx)" -eq 64
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x4' imma_s8.ptx
          # Asserted absent, not merely unasserted: if a future change makes B
          # loadable through ldmatrix.trans, this line is what forces the kernel
          # comment and the 128 scalar loads below to be revisited together.
          if grep -q 'ldmatrix\.[a-z0-9.]*trans' imma_s8.ptx; then echo "imma_s8: B now uses ldmatrix.trans; update the doc comment and the ld.shared.b8 count"; exit 1; fi
          test "$(grep -c 'ld\.shared\.b8' imma_s8.ptx)" -eq 128
          grep -q 'cp\.async\.cg\.shared\.global' imma_s8.ptx
          grep -q 'cp\.async\.wait_group' imma_s8.ptx
          if grep -qE '\$[0-9]|%\[' imma_s8.ptx; then echo "imma_s8: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' imma_s8.ptx)" -eq 2
          # The s8 shape needs sm_80; the default kernel target is sm_90.
          grep -q '\.target sm_9' imma_s8.ptx
          # imma_s4: int4 mma shape, two s4 per byte, s32 accumulators. Same
          # tiling, pipeline and A path as imma_s8; the B gather needs 8
          # k-contiguous values per register now, so the scalar-load count
          # doubles. Same trans-guard reasoning as imma_s8.
          test "$(grep -c 'mma\.sync\.aligned\.m16n8k64\.row\.col\.s32\.s4\.s4\.s32' imma_s4.ptx)" -eq 64
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x4' imma_s4.ptx
          if grep -q 'ldmatrix\.[a-z0-9.]*trans' imma_s4.ptx; then echo "imma_s4: B now uses ldmatrix.trans; update the doc comment and the ld.shared.b8 count"; exit 1; fi
          test "$(grep -c 'ld\.shared\.b8' imma_s4.ptx)" -eq 256
          grep -q 'cp\.async\.cg\.shared\.global' imma_s4.ptx
          grep -q 'cp\.async\.wait_group' imma_s4.ptx
          if grep -qE '\$[0-9]|%\[' imma_s4.ptx; then echo "imma_s4: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' imma_s4.ptx)" -eq 2
          grep -q '\.target sm_9' imma_s4.ptx
          if grep -q 'st\.local' imma_s4.ptx; then echo "imma_s4: spilled to local memory"; exit 1; fi
          # hgemm_sp: 2:4 sparse f16 mma. A is pruned to half width, so its
          # fragment load is the plain x2 ldmatrix (8x = 4 m-tiles x 2
          # pipeline instances); B is dense and keeps the x2.trans path.
          # The metadata path shows up as scalar u16 shared loads (2 per
          # m-tile per instance = 16).
          test "$(grep -c 'mma\.sp::ordered_metadata\.sync\.aligned\.m16n8k16\.row\.col\.f32\.f16\.f16\.f32' hgemm_sp.ptx)" -eq 64
          test "$(grep -c 'ldmatrix\.sync\.aligned\.m8n8\.x2\.shared\.b16' hgemm_sp.ptx)" -eq 8
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x2\.trans' hgemm_sp.ptx
          test "$(grep -c 'ld\.shared\.b16\|ld\.shared\.u16' hgemm_sp.ptx)" -eq 16
          grep -q 'cp\.async\.cg\.shared\.global' hgemm_sp.ptx
          grep -q 'cp\.async\.wait_group' hgemm_sp.ptx
          if grep -qE '\$[0-9]|%\[' hgemm_sp.ptx; then echo "hgemm_sp: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' hgemm_sp.ptx)" -eq 2
          grep -q '\.target sm_9' hgemm_sp.ptx
          if grep -q 'st\.local' hgemm_sp.ptx; then echo "hgemm_sp: spilled to local memory"; exit 1; fi
          # wgmma kernels: sm_90a target, RS vs SS operand forms, pipeline depth.
          for f in wgmma_smoke hgemm_wgmma hgemm_wgmma2 hgemm_wgmma3; do
            grep -q '\.target sm_90a' "$f.ptx" || { echo "$f: not built for sm_90a"; exit 1; }
            grep -q 'wgmma\.mma_async\.sync\.aligned\.m64n16k16' "$f.ptx"
            if grep -qE '\$[0-9]|%\[' "$f.ptx"; then echo "$f: unsubstituted operand"; exit 1; fi
          done
          # v3 drains the tensor core every stage; v4/v5 keep one group in flight.
          grep -q 'wgmma\.wait_group\.sync\.aligned 0' hgemm_wgmma.ptx
          if grep -q 'wgmma\.wait_group\.sync\.aligned 1' hgemm_wgmma.ptx; then
            echo "hgemm_wgmma: expected the 2-stage form to drain with wait_group 0"; exit 1
          fi
          grep -q 'wgmma\.wait_group\.sync\.aligned 1' hgemm_wgmma2.ptx
          grep -q 'wgmma\.wait_group\.sync\.aligned 1' hgemm_wgmma3.ptx
          # v5 sources A from registers: ldmatrix feeds 8 wgmma per stage, and the
          # fragments must stay in registers (a spill here would defeat the point).
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x4' hgemm_wgmma3.ptx
          if grep -q 'st\.local' hgemm_wgmma3.ptx; then
            echo "hgemm_wgmma3: A fragments spilled to local memory"; exit 1
          fi
          # The RS operand form takes two brace groups (accumulators, then A);
          # the SS form takes one followed by two descriptors.
          grep -qE 'wgmma\.mma_async[^{]*\{[^}]*\}, \{[^}]*\}' hgemm_wgmma3.ptx
          # f16_native: Zig's own f16 / @Vector(2, f16) must keep lowering to the
          # packed instructions. This is a property of Zig's NVPTX backend, not of
          # this repo, so a regression upstream would otherwise be invisible —
          # and it is the reason no f16 wrapper layer exists here.
          grep -q 'mul\.rn\.f16x2' f16_native.ptx
          grep -q 'fma\.rn\.f16x2' f16_native.ptx
          grep -q 'max\.f16x2' f16_native.ptx
          grep -q 'fma\.rn\.f16' f16_native.ptx
          grep -q 'ld\.global\.b32' f16_native.ptx   # 2-wide f16 loads merge
          # hgemm kernels take f16 pointers, not byte pointers, so the host side
          # can type-check the buffers it passes.
          for f in hgemm_mma hgemm_mma2 hgemm_wgmma hgemm_wgmma2 hgemm_wgmma3; do
            grep -q '\.param \.u64 \.ptr' "$f.ptx" || { echo "$f: expected pointer params"; exit 1; }
          done
          # hgemm_wgmma4 sidesteps the 15-output asm limit by keeping the
          # accumulator in PTX registers LLVM cannot see. Two conditions make that
          # safe, and both are invisible in the source:
          #   the .reg declaration must appear exactly once, or ptxas rejects the
          #   redefinition;
          #   the wgmma must carry no output operands, which is what removes the
          #   limit in the first place.
          test "$(grep -c 'reg \.f32 %zacc' hgemm_wgmma4.ptx)" -eq 1
          grep -q 'm64n128k16' hgemm_wgmma4.ptx
          test "$(grep -c 'mov\.f32 %r[0-9]*, %zacc' hgemm_wgmma4.ptx)" -eq 64
          if grep -q 'st\.local' hgemm_wgmma4.ptx; then
            echo "hgemm_wgmma4 spilled"; exit 1
          fi
          # The declaration has to precede every use; asm volatile keeps its order,
          # but assert it rather than trust it.
          decl=$(grep -n 'reg \.f32 %zacc' hgemm_wgmma4.ptx | head -1 | cut -d: -f1)
          first_use=$(grep -n '%zacc0' hgemm_wgmma4.ptx | head -1 | cut -d: -f1)
          [ "$decl" -le "$first_use" ] || { echo "hgemm_wgmma4: %zacc used before declaration"; exit 1; }
          # cpasync_mbar_smoke: every generated cp.async / mbarrier / counted-barrier
          # wrapper (6 families, 35 decls in src/gen) must reach PTX. The kernel is
          # form-only — mbar_smoke covers semantics; this covers the bindings.
          grep -q '\.target sm_90a' cpasync_mbar_smoke.ptx
          # cp_async_copy: ca at 4/8/16, cg at 16, then the zfill variants with
          # the extra src-size operand.
          for sz in 4 8 16; do
            grep -qE "cp\.async\.ca\.shared\.global \[.+\], \[.+\], $sz;" cpasync_mbar_smoke.ptx
            grep -qE "cp\.async\.ca\.shared\.global \[.+\], \[.+\], $sz, $sz;" cpasync_mbar_smoke.ptx
          done
          grep -qE 'cp\.async\.cg\.shared\.global \[.+\], \[.+\], 16;' cpasync_mbar_smoke.ptx
          grep -qE 'cp\.async\.cg\.shared\.global \[.+\], \[.+\], 16, 16;' cpasync_mbar_smoke.ptx
          # cp_async_control.
          grep -q 'cp\.async\.commit_group' cpasync_mbar_smoke.ptx
          grep -qE 'cp\.async\.wait_group\s+0' cpasync_mbar_smoke.ptx
          grep -q 'cp\.async\.wait_all' cpasync_mbar_smoke.ptx
          # cp_async_mbarrier: shared-typed and generic forms, inc and noinc.
          grep -q 'cp\.async\.mbarrier\.arrive\.shared\.b64' cpasync_mbar_smoke.ptx
          grep -q 'cp\.async\.mbarrier\.arrive\.noinc\.shared\.b64' cpasync_mbar_smoke.ptx
          grep -q 'cp\.async\.mbarrier\.arrive\.b64' cpasync_mbar_smoke.ptx
          grep -q 'cp\.async\.mbarrier\.arrive\.noinc\.b64' cpasync_mbar_smoke.ptx
          # mbarrier_basic.
          grep -q 'mbarrier\.init\.shared\.b64' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.arrive\.shared\.b64' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.arrive\.noComplete\.shared\.b64' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.inval\.shared\.b64' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.test_wait\.shared\.b64' cpasync_mbar_smoke.ptx
          # mbarrier_extended.
          grep -q 'nanosleep\.u32' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.try_wait\.shared\.b64' cpasync_mbar_smoke.ptx
          grep -q 'fence\.mbarrier_init\.release\.cluster' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.arrive\.expect_tx\.release\.cta\.shared::cta\.b64' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.arrive\.expect_tx\.relaxed\.cluster\.shared::cta\.b64' cpasync_mbar_smoke.ptx
          grep -q 'fence\.proxy\.async::generic\.release\.sync_restrict::shared::cta\.cluster' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.try_wait\.parity\.shared::cta\.b64' cpasync_mbar_smoke.ptx
          grep -q 'fence\.proxy\.async::generic\.acquire\.sync_restrict::shared::cluster\.cluster' cpasync_mbar_smoke.ptx
          grep -q 'fence\.proxy\.async\.shared::cta' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.arrive\.release\.cluster\.shared::cluster\.b64' cpasync_mbar_smoke.ptx
          grep -q 'mbarrier\.try_wait\.parity\.acquire\.cluster\.shared::cta\.b64' cpasync_mbar_smoke.ptx
          # counted_barrier: LLVM names the aligned forms barrier.* and the
          # plain ones bar.*.
          grep -q 'barrier\.arrive' cpasync_mbar_smoke.ptx
          grep -q 'barrier\.sync' cpasync_mbar_smoke.ptx
          grep -q 'bar\.arrive' cpasync_mbar_smoke.ptx
          grep -q 'bar\.sync' cpasync_mbar_smoke.ptx
          # warpops_smoke: the generated warp-level wrappers (6 families, 38
          # decls in src/gen; the two match.all forms are not reachable, see
          # src/examples/warpops_smoke.zig) must reach PTX. Built for sm_100a
          # because LLVM gates redux.sync.*.f32 on it. Form-only — warp_reduce
          # covers shuffle semantics; this covers the bindings.
          grep -q '\.target sm_100a' warpops_smoke.ptx
          # redux: integer add/min/max (s32/u32) and and/or/xor, then the f32
          # min/max in plain, abs, NaN and abs.NaN forms.
          grep -q 'redux\.sync\.add\.s32' warpops_smoke.ptx
          grep -q 'redux\.sync\.min\.s32' warpops_smoke.ptx
          grep -q 'redux\.sync\.max\.s32' warpops_smoke.ptx
          grep -q 'redux\.sync\.min\.u32' warpops_smoke.ptx
          grep -q 'redux\.sync\.max\.u32' warpops_smoke.ptx
          grep -q 'redux\.sync\.and\.b32' warpops_smoke.ptx
          grep -q 'redux\.sync\.or\.b32' warpops_smoke.ptx
          grep -q 'redux\.sync\.xor\.b32' warpops_smoke.ptx
          grep -q 'redux\.sync\.min\.f32' warpops_smoke.ptx
          grep -q 'redux\.sync\.max\.f32' warpops_smoke.ptx
          grep -q 'redux\.sync\.min\.abs\.f32' warpops_smoke.ptx
          grep -q 'redux\.sync\.max\.abs\.f32' warpops_smoke.ptx
          grep -q 'redux\.sync\.min\.NaN\.f32' warpops_smoke.ptx
          grep -q 'redux\.sync\.max\.NaN\.f32' warpops_smoke.ptx
          grep -q 'redux\.sync\.min\.abs\.NaN\.f32' warpops_smoke.ptx
          grep -q 'redux\.sync\.max\.abs\.NaN\.f32' warpops_smoke.ptx
          # warp_match: the match.any forms at 32 and 64 bits.
          grep -q 'match\.any\.sync\.b32' warpops_smoke.ptx
          grep -q 'match\.any\.sync\.b64' warpops_smoke.ptx
          # vote, active_mask, warp_barrier.
          grep -q 'vote\.sync\.any' warpops_smoke.ptx
          grep -q 'vote\.sync\.all' warpops_smoke.ptx
          grep -q 'vote\.sync\.uni' warpops_smoke.ptx
          grep -q 'vote\.sync\.ballot' warpops_smoke.ptx
          grep -q 'activemask\.b32' warpops_smoke.ptx
          grep -q 'bar\.warp\.sync' warpops_smoke.ptx
          # warp_shuffle: every .sync form (the u64 asm wrappers split into two
          # b32 shuffles, so the counts exceed the 8 NVVM calls).
          for m in up down bfly idx; do
            grep -q "shfl\.sync\.$m\.b32" warpops_smoke.ptx
          done
          # ldmatrix_smoke: all 18 generated ldmatrix wrappers (gen.matrix) plus
          # the 4 stmatrix forms and the movmatrix asm wrapper must reach PTX.
          # Built for sm_100a because the b8 / b8x16 ldmatrix variants are not
          # selectable on sm_90a. The gen stmatrix wrappers never lower in Zig
          # 0.16 (they reach PTX as an unresolved llvm.nvvm call), so stmatrix
          # is emitted from hand-written inline asm in the example — see the
          # header of src/examples/ldmatrix_smoke.zig. Form-only; hgemm_mma2
          # covers ldmatrix semantics.
          grep -q '\.target sm_100a' ldmatrix_smoke.ptx
          # m8n8 b16: x1/x2/x4, plain and trans.
          for v in x1 x2 x4; do
            grep -q "ldmatrix\.sync\.aligned\.m8n8\.$v\.shared\.b16" ldmatrix_smoke.ptx
            grep -q "ldmatrix\.sync\.aligned\.m8n8\.$v\.trans\.shared\.b16" ldmatrix_smoke.ptx
          done
          # m16n16 b8 and the b8x16 packed variants (6-bit p32 / 4-bit p64).
          grep -q 'ldmatrix\.sync\.aligned\.m16n16\.x1\.trans\.shared\.b8' ldmatrix_smoke.ptx
          grep -q 'ldmatrix\.sync\.aligned\.m16n16\.x2\.trans\.shared\.b8' ldmatrix_smoke.ptx
          for pk in b6x16_p32 b4x16_p64; do
            grep -q "ldmatrix\.sync\.aligned\.m16n16\.x1\.trans\.shared\.b8x16\.$pk" ldmatrix_smoke.ptx
            grep -q "ldmatrix\.sync\.aligned\.m16n16\.x2\.trans\.shared\.b8x16\.$pk" ldmatrix_smoke.ptx
            for v in x1 x2 x4; do
              grep -q "ldmatrix\.sync\.aligned\.m8n16\.$v\.shared\.b8x16\.$pk" ldmatrix_smoke.ptx
            done
          done
          # stmatrix (inline asm): x2/x4, plain and trans.
          for v in x2 x4; do
            grep -q "stmatrix\.sync\.aligned\.m8n8\.$v\.shared\.b16" ldmatrix_smoke.ptx
            grep -q "stmatrix\.sync\.aligned\.m8n8\.$v\.trans\.shared\.b16" ldmatrix_smoke.ptx
          done
          grep -q 'movmatrix\.sync\.aligned\.m8n8\.trans\.b16' ldmatrix_smoke.ptx
          # No unresolved NVVM calls may survive: every matrix op must be a real
          # instruction, not a call to an llvm.nvvm.* symbol.
          if grep -q 'llvm\.nvvm' ldmatrix_smoke.ptx; then
            echo "ldmatrix_smoke: unresolved NVVM intrinsic call"; exit 1
          fi
          # atomics_smoke: the general atomics surface. atom.* comes from
          # Zig's @atomicRmw/@cmpxchgStrong through the cuda.zig wrappers
          # (the catalog has no plain atom.* entries); red.* is inline asm,
          # because the LLVM NVPTX backend never selects the no-return
          # reduction form even for a discarded result. Form-only —
          # atomic_counter covers semantics.
          grep -q 'atom\.global\.add\.u32' atomics_smoke.ptx
          grep -q 'atom\.global\.add\.u64' atomics_smoke.ptx
          grep -q 'atom\.global\.add\.f32' atomics_smoke.ptx
          grep -q 'atom\.global\.add\.f64' atomics_smoke.ptx
          grep -q 'atom\.global\.min\.u32' atomics_smoke.ptx
          grep -q 'atom\.global\.max\.u32' atomics_smoke.ptx
          grep -q 'atom\.global\.min\.s32' atomics_smoke.ptx
          grep -q 'atom\.global\.max\.s32' atomics_smoke.ptx
          grep -q 'atom\.global\.min\.u64' atomics_smoke.ptx
          grep -q 'atom\.global\.max\.u64' atomics_smoke.ptx
          grep -q 'atom\.global\.max\.s64' atomics_smoke.ptx
          grep -q 'atom\.global\.and\.b32' atomics_smoke.ptx
          grep -q 'atom\.global\.or\.b32' atomics_smoke.ptx
          grep -q 'atom\.global\.xor\.b32' atomics_smoke.ptx
          grep -q 'atom\.global\.exch\.b32' atomics_smoke.ptx
          grep -q 'atom\.global\.exch\.b64' atomics_smoke.ptx
          grep -qE 'atom\.[a-z.]*global\.cas\.b32' atomics_smoke.ptx
          grep -q 'atom\.shared\.add\.u32' atomics_smoke.ptx
          grep -q 'atom\.shared\.min\.u32' atomics_smoke.ptx
          grep -q 'atom\.shared\.max\.s32' atomics_smoke.ptx
          grep -q 'atom\.shared\.exch\.b32' atomics_smoke.ptx
          for op in add.u32 min.u32 max.s32 and.b32 or.b32 xor.b32 inc.u32 dec.u32 add.f32; do
            grep -q "red\.global\.$op" atomics_smoke.ptx
          done
          # packed_smoke: the generated packed-data bindings (8 families, 127
          # decls in src/gen) must reach PTX. Built for sm_100a: the fp8 cvt
          # intrinsics gate on sm_89+ and clusterlaunchcontrol on sm_90a+ in
          # LLVM. The two gen.dotprod.dp2a_* wrappers have no NVPTX selection
          # pattern in LLVM and are emitted from hand-written asm in the
          # example. abs.bf16x2, mul.rn.f32x2 and prmt.b32.b4e already carry
          # assertions under asm_smoke.ptx and are not repeated here. Form-only
          # — f16_native covers f16x2 semantics; this covers the bindings.
          grep -q '\.target sm_100a' packed_smoke.ptx
          # packed_alu, f16x2 (13): arithmetic, min/max, fma modifier matrix.
          for i in add.rn sub.rn mul.rn neg abs min max; do
            grep -q "$i\.f16x2 " packed_smoke.ptx
          done
          for m in '' '.ftz' '.sat' '.ftz.sat' '.relu' '.ftz.relu'; do
            grep -q "fma\.rn$m\.f16x2 " packed_smoke.ptx
          done
          # packed_alu, bf16x2 (9; abs covered by asm_smoke).
          for i in add.rn sub.rn mul.rn neg min max; do
            grep -q "$i\.bf16x2 " packed_smoke.ptx
          done
          grep -q 'fma\.rn\.bf16x2 ' packed_smoke.ptx
          grep -q 'fma\.rn\.relu\.bf16x2 ' packed_smoke.ptx
          # packed_alu, f32x2 (8; mul.rn covered by asm_smoke).
          for i in add.rn add.rn.ftz sub.rn sub.rn.ftz mul.rn.ftz fma.rn fma.rn.ftz; do
            grep -q "$i\.f32x2 " packed_smoke.ptx
          done
          # extended_minmax, f16 (16): min/max x {plain,ftz,NaN,ftz.NaN} x
          # {plain,xorsign.abs}.
          for op in min max; do
            for m in '' '.ftz' '.NaN' '.ftz.NaN'; do
              for x in '' '.xorsign.abs'; do
                grep -q "$op$m$x\.f16 " packed_smoke.ptx
              done
            done
          done
          # extended_minmax, f16x2 (14): same matrix minus the plain forms
          # (those are packed_alu).
          for op in min max; do
            for m in '' '.ftz' '.NaN' '.ftz.NaN'; do
              for x in '' '.xorsign.abs'; do
                [ -z "$m$x" ] && continue
                grep -q "$op$m$x\.f16x2 " packed_smoke.ptx
              done
            done
          done
          # extended_minmax, bf16 (8) and bf16x2 (6): no ftz variants.
          for op in min max; do
            for m in '' '.NaN'; do
              for x in '' '.xorsign.abs'; do
                grep -q "$op$m$x\.bf16 " packed_smoke.ptx
                [ -z "$m$x" ] && continue
                grep -q "$op$m$x\.bf16x2 " packed_smoke.ptx
              done
            done
          done
          # extended_minmax, f32 (8): xorsign.abs forms only.
          for op in min max; do
            for m in '' '.ftz' '.NaN' '.ftz.NaN'; do
              grep -q "$op$m\.xorsign\.abs\.f32 " packed_smoke.ptx
            done
          done
          # integer_minmax (8).
          grep -q 'min\.relu\.s32 ' packed_smoke.ptx
          grep -q 'max\.relu\.s32 ' packed_smoke.ptx
          for i in 'max\.s16x2' 'min\.s16x2' 'max\.u16x2' 'min\.u16x2' 'max\.relu\.s16x2' 'min\.relu\.s16x2'; do
            grep -q "$i " packed_smoke.ptx
          done
          # packed_conversion (18): fp8<->f16x2, fp8<-f32, f32x2->f16x2/bf16x2.
          for t in e4m3x2 e5m2x2; do
            grep -q "cvt\.rn\.satfinite\.$t\.f32 " packed_smoke.ptx
            grep -q "cvt\.rn\.satfinite\.relu\.$t\.f32 " packed_smoke.ptx
            grep -q "cvt\.rn\.f16x2\.$t " packed_smoke.ptx
            grep -q "cvt\.rn\.relu\.f16x2\.$t " packed_smoke.ptx
            grep -q "cvt\.rn\.satfinite\.$t\.f16x2 " packed_smoke.ptx
            grep -q "cvt\.rn\.satfinite\.relu\.$t\.f16x2 " packed_smoke.ptx
          done
          for i in 'cvt\.rn\.f16x2\.f32' 'cvt\.rz\.f16x2\.f32' 'cvt\.rn\.relu\.f16x2\.f32' \
                   'cvt\.rn\.bf16x2\.f32' 'cvt\.rz\.bf16x2\.f32' 'cvt\.rn\.relu\.bf16x2\.f32'; do
            grep -q "$i " packed_smoke.ptx
          done
          # packed_atomic (2).
          grep -q 'atom\.global\.add\.noftz\.f16x2 ' packed_smoke.ptx
          grep -q 'atom\.global\.add\.noftz\.bf16x2 ' packed_smoke.ptx
          # dotprod (4): dp4a from NVVM, dp2a from the hand-written asm.
          grep -q 'dp4a\.u32\.u32 ' packed_smoke.ptx
          grep -q 'dp4a\.s32\.s32 ' packed_smoke.ptx
          for t in u32 s32; do
            for h in lo hi; do
              grep -q "dp2a\.$h\.$t\.$t " packed_smoke.ptx
            done
          done
          # prmt (7; b4e covered by asm_smoke).
          grep -q 'prmt\.b32 ' packed_smoke.ptx
          for m in f4e ecl rc8 ecr rc16; do
            grep -q "prmt\.b32\.$m " packed_smoke.ptx
          done
          # clc (6).
          grep -q 'clusterlaunchcontrol\.try_cancel\.async\.shared::cta\.mbarrier::complete_tx::bytes\.b128' packed_smoke.ptx
          grep -q 'clusterlaunchcontrol\.try_cancel\.async\.shared::cta\.mbarrier::complete_tx::bytes\.multicast::cluster::all\.b128' packed_smoke.ptx
          for a in x y z; do
            grep -q "clusterlaunchcontrol\.query_cancel\.get_first_ctaid::$a\.b32\.b128" packed_smoke.ptx
          done
          grep -q 'clusterlaunchcontrol\.query_cancel\.is_canceled\.pred\.b128' packed_smoke.ptx
          # No unresolved NVVM calls or unsubstituted asm operands may survive.
          if grep -q 'llvm\.nvvm' packed_smoke.ptx; then
            echo "packed_smoke: unresolved NVVM intrinsic call"; exit 1
          fi
          if grep -qE '\$[0-9]|%\[' packed_smoke.ptx; then
            echo "packed_smoke: unsubstituted operand"; exit 1
          fi
          echo "PTX invariants OK"

      - name: pod-verify degraded mode (no GPU runner)
        run: |
          set -euo pipefail
          ./scripts/pod-verify.sh ./zig-out/bin/zoxide zig-out/kernels
          ls zoxide-verify-*.txt
          grep -q 'totals: PASS=1 FAIL=0 SKIP=10' zoxide-verify-*.txt

      - name: Cross-compile x86_64-linux-gnu (pod runner build)
        run: zig build -Dtarget=x86_64-linux-gnu.2.28 -Doptimize=ReleaseSmall --prefix /tmp/zoxide-gnu

      - name: Cross-compile aarch64-linux-musl (static)
        run: zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall --prefix /tmp/zoxide-musl

      - name: Verify binary shapes
        run: |
          file /tmp/zoxide-gnu/bin/zoxide | grep -q 'dynamically linked'
          file /tmp/zoxide-musl/bin/zoxide | grep -q 'statically linked'

      - name: Downstream package integration
        run: |
          set -euo pipefail
          zig build
          zig build ptx
          # Same assertion as for the scaffold. tests/downstream had this exact
          # mismatch and it survived until the binary was first run on a GPU,
          # because nothing on a machine without one can detect it.
          entry=$(grep -oh '\.entry [^(]*' zig-out/kernels/*.ptx | sed 's/\.entry //' | head -1)
          want=$(grep -o 'gpu\.symbol("[^"]*", "[^"]*")' main.zig | sed 's/gpu\.symbol("//; s/", "/_$_/; s/")//' | head -1)
          if [ "$entry" != "$want" ]; then
            echo "downstream: PTX entry '$entry' does not match the symbol main.zig looks up ('$want')"; exit 1
          fi
          echo "downstream entry point agrees with host lookup: $entry"
        working-directory: tests/downstream
      - name: Scaffold integration (zoxide new)
        run: |
          set -euo pipefail
          rm -rf /tmp/scaffold && mkdir -p /tmp/scaffold
          ./zig-out/bin/zoxide new scaffolded --dir /tmp/scaffold/scaffolded --zoxide-path "$PWD"
          cd /tmp/scaffold/scaffolded
          zig build
          zig build ptx
          # The PTX symbol prefix is the root source file's stem, not the build
          # artifact's name. Those differed once and produced a package whose host
          # side could not find its own kernel, with no build error — so assert
          # the generated launch lookup matches the generated entry point.
          entry=$(grep -oh '\.entry [^(]*' zig-out/kernels/*.ptx | sed 's/\.entry //' | head -1)
          want=$(grep -o 'gpu\.symbol("[^"]*", "[^"]*")' main.zig | sed 's/gpu\.symbol("//; s/", "/_$_/; s/")//' | head -1)
          if [ "$entry" != "$want" ]; then
            echo "scaffold: PTX entry '$entry' does not match the symbol main.zig looks up ('$want')"; exit 1
          fi
          echo "scaffold entry point agrees with host lookup: $entry"
          # A generated template that spills is a template bug.
          if grep -q 'st\.local' zig-out/kernels/*.ptx; then echo "scaffold kernel spilled"; exit 1; fi
          # Degrades cleanly with no GPU on the CI runner.
          ./zig-out/bin/scaffolded

      - name: doctor degrades gracefully without GPU
        run: ./zig-out/bin/zoxide doctor

  # Real-hardware job. Gated on a repository variable rather than only on runner
  # labels, because a job targeting an unavailable label queues indefinitely
  # instead of being skipped. Set HAS_GPU_RUNNER=true once a self-hosted runner
  # with an NVIDIA GPU is registered with the `gpu` label.
  #
  # This exists because of a concrete miss: tests/downstream looked up the wrong
  # kernel symbol for two commits. Nothing on a machine without a GPU can detect
  # that — the package compiles, links and exits cleanly, and only an actual
  # launch notices. Everything below is exactly the class of bug the CPU job
  # cannot see.
  gpu:
    if: vars.HAS_GPU_RUNNER == 'true'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build CLI and kernels
        run: |
          zig build
          zig build kernels
      - name: doctor sees the GPU
        run: |
          set -euo pipefail
          ./zig-out/bin/zoxide doctor --arch sm_90 | tee /tmp/doctor.txt
          grep -q '^\[ok  \] gpu:' /tmp/doctor.txt
      - name: Full pod verification
        run: |
          set -euo pipefail
          ./scripts/pod-verify.sh ./zig-out/bin/zoxide zig-out/kernels
      - name: Downstream package launches for real
        run: |
          set -euo pipefail
          zig build run
        working-directory: tests/downstream
      - name: Scaffolded package launches for real
        run: |
          set -euo pipefail
          rm -rf /tmp/gpu-scaffold && mkdir -p /tmp/gpu-scaffold
          ./zig-out/bin/zoxide new gpuscaffold --dir /tmp/gpu-scaffold/s --zoxide-path "$PWD"
          cd /tmp/gpu-scaffold/s
          zig build run
      - name: Headline kernel still exact
        run: |
          set -euo pipefail
          ./zig-out/bin/zoxide bench zig-out/kernels/hgemm_wgmma3.ptx \
            --n 4096 --iters 10 --arch sm_90a | tee /tmp/hgemm.txt
          grep -q '^PASS' /tmp/hgemm.txt
          # Guard the property, not the number: the accumulators living in
          # registers is the entire point of this variant, and a spill silently
          # costs about half the throughput.
          if grep -q 'spilled to local memory' /tmp/hgemm.txt; then
            echo "hgemm_wgmma3 spilled"; exit 1
          fi
