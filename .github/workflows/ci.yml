name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build host CLI
        run: zig build

      - name: Host unit tests
        run: zig build test
      - name: Build example kernels (PTX)
        run: zig build kernels

      - name: Assert PTX invariants
        run: |
          set -euo pipefail
          cd zig-out/kernels
          for f in *.ptx; do
            grep -q '\.entry' "$f" || { echo "$f: missing .entry"; exit 1; }
            if grep -q '\$0' "$f"; then echo "$f: unsubstituted \$0 placeholder"; exit 1; fi
          done
          grep -q '\.shared' shared_reverse.ptx
          grep -q 'shfl\.sync' warp_reduce.ptx
          grep -q 'vote\.sync\.ballot' intrinsics_smoke.ptx
          grep -q 'cp\.async\.ca\.shared\.global' intrinsics_smoke.ptx
          grep -q '\.shared' sgemm_tiled.ptx
          grep -q 'st\.shared' sgemm_tiled.ptx
          grep -q 'ld\.shared' sgemm_tiled.ptx
          # Regression guard for the real-GPU deadlock (docs/verification.md):
          # atomic_counter's bar.sync must not be duplicated onto divergent
          # paths — exactly 2 sites, both before the first conditional branch.
          test "$(grep -c 'bar\.sync' atomic_counter.ptx)" -eq 2
          first_bar=$(grep -n 'bar\.sync' atomic_counter.ptx | head -1 | cut -d: -f1)
          first_branch=$(grep -nE '@%p[0-9]+ bra' atomic_counter.ptx | head -1 | cut -d: -f1)
          [ "$first_bar" -lt "$first_branch" ] || { echo "atomic_counter: bar.sync after branch"; exit 1; }
          # sgemm_tiled: the tile loop must keep exactly 2 bar.sync sites
          # (one after tile load, one after the dot-product loop).
          test "$(grep -c 'bar\.sync' sgemm_tiled.ptx)" -eq 2
          # sgemm_reg: FMA must be emitted (register-blocked inner loop) and
          # the tile loop must keep exactly 2 bar.sync sites.
          test "$(grep -c 'fma\.rn\.f32' sgemm_reg.ptx)" -ge 64
          test "$(grep -c 'bar\.sync' sgemm_reg.ptx)" -eq 2
          grep -q '\.shared' sgemm_reg.ptx
          # sgemm_opt / sgemm_opt2: vectorized (128-bit) global->shared loads.
          grep -qE 'ld\.global\.(v4|v2\.b64)' sgemm_opt.ptx
          grep -qE 'ld\.global\.(v4|v2\.b64)' sgemm_opt2.ptx
          grep -qE 'st\.shared\.(v4|v2\.b64)' sgemm_opt.ptx
          test "$(grep -c 'fma\.rn\.f32' sgemm_opt.ptx)" -ge 64
          test "$(grep -c 'fma\.rn\.f32' sgemm_opt2.ptx)" -ge 64
          test "$(grep -c 'bar\.sync' sgemm_opt.ptx)" -eq 2
          # opt2: prologue + 2 per tile loop iteration
          test "$(grep -c 'bar\.sync' sgemm_opt2.ptx)" -eq 3
          # sgemm_swz: conflict-free B fragments via two float4 chunks.
          grep -qE 'ld\.shared\.v4' sgemm_swz.ptx
          test "$(grep -c 'fma\.rn\.f32' sgemm_swz.ptx)" -ge 64
          test "$(grep -c 'bar\.sync' sgemm_swz.ptx)" -eq 2
          # debug_print: device printf lowers to a vprintf call with a
          # .global format string.
          grep -q 'vprintf' debug_print.ptx
          grep -q '\.global' debug_print.ptx
          # asm_smoke: asm-template bindings produce real registers
          # (no positional $N or %[ residue).
          grep -q 'abs\.bf16x2 %r' asm_smoke.ptx
          grep -q 'mul\.rn\.f32x2 %rd' asm_smoke.ptx
          grep -q 'prmt\.b32\.b4e' asm_smoke.ptx
          grep -q 'mma\.sync\.aligned\.m16n8k16' asm_smoke.ptx
          if grep -qE '\$[0-9]|%\[' asm_smoke.ptx; then echo "asm_smoke: unsubstituted operand"; exit 1; fi
          # hgemm_mma: real tensor-core mma instructions, no placeholder residue
          test "$(grep -c 'mma\.sync\.aligned\.m16n8k16' hgemm_mma.ptx)" -eq 8
          if grep -qE '\$[0-9]|%\[' hgemm_mma.ptx; then echo "hgemm_mma: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' hgemm_mma.ptx)" -eq 2
          # hgemm_mma2: ldmatrix + cp.async + mma all present
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x4' hgemm_mma2.ptx
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x2\.trans' hgemm_mma2.ptx
          grep -q 'cp\.async\.cg\.shared\.global' hgemm_mma2.ptx
          grep -q 'cp\.async\.wait_group' hgemm_mma2.ptx
          test "$(grep -c 'mma\.sync\.aligned\.m16n8k16' hgemm_mma2.ptx)" -eq 64
          if grep -qE '\$[0-9]|%\[' hgemm_mma2.ptx; then echo "hgemm_mma2: unsubstituted operand"; exit 1; fi
          test "$(grep -c 'bar\.sync' hgemm_mma2.ptx)" -eq 2
          # wgmma kernels: sm_90a target, RS vs SS operand forms, pipeline depth.
          for f in wgmma_smoke hgemm_wgmma hgemm_wgmma2 hgemm_wgmma3; do
            grep -q '\.target sm_90a' "$f.ptx" || { echo "$f: not built for sm_90a"; exit 1; }
            grep -q 'wgmma\.mma_async\.sync\.aligned\.m64n16k16' "$f.ptx"
            if grep -qE '\$[0-9]|%\[' "$f.ptx"; then echo "$f: unsubstituted operand"; exit 1; fi
          done
          # v3 drains the tensor core every stage; v4/v5 keep one group in flight.
          grep -q 'wgmma\.wait_group\.sync\.aligned 0' hgemm_wgmma.ptx
          if grep -q 'wgmma\.wait_group\.sync\.aligned 1' hgemm_wgmma.ptx; then
            echo "hgemm_wgmma: expected the 2-stage form to drain with wait_group 0"; exit 1
          fi
          grep -q 'wgmma\.wait_group\.sync\.aligned 1' hgemm_wgmma2.ptx
          grep -q 'wgmma\.wait_group\.sync\.aligned 1' hgemm_wgmma3.ptx
          # v5 sources A from registers: ldmatrix feeds 8 wgmma per stage, and the
          # fragments must stay in registers (a spill here would defeat the point).
          grep -q 'ldmatrix\.sync\.aligned\.m8n8\.x4' hgemm_wgmma3.ptx
          if grep -q 'st\.local' hgemm_wgmma3.ptx; then
            echo "hgemm_wgmma3: A fragments spilled to local memory"; exit 1
          fi
          # The RS operand form takes two brace groups (accumulators, then A);
          # the SS form takes one followed by two descriptors.
          grep -qE 'wgmma\.mma_async[^{]*\{[^}]*\}, \{[^}]*\}' hgemm_wgmma3.ptx
          # f16_native: Zig's own f16 / @Vector(2, f16) must keep lowering to the
          # packed instructions. This is a property of Zig's NVPTX backend, not of
          # this repo, so a regression upstream would otherwise be invisible —
          # and it is the reason no f16 wrapper layer exists here.
          grep -q 'mul\.rn\.f16x2' f16_native.ptx
          grep -q 'fma\.rn\.f16x2' f16_native.ptx
          grep -q 'max\.f16x2' f16_native.ptx
          grep -q 'fma\.rn\.f16' f16_native.ptx
          grep -q 'ld\.global\.b32' f16_native.ptx   # 2-wide f16 loads merge
          # hgemm kernels take f16 pointers, not byte pointers, so the host side
          # can type-check the buffers it passes.
          for f in hgemm_mma hgemm_mma2 hgemm_wgmma hgemm_wgmma2 hgemm_wgmma3; do
            grep -q '\.param \.u64 \.ptr' "$f.ptx" || { echo "$f: expected pointer params"; exit 1; }
          done
          echo "PTX invariants OK"

      - name: pod-verify degraded mode (no GPU runner)
        run: |
          set -euo pipefail
          ./scripts/pod-verify.sh ./zig-out/bin/zoxide zig-out/kernels
          ls zoxide-verify-*.txt
          grep -q 'totals: PASS=1 FAIL=0 SKIP=10' zoxide-verify-*.txt

      - name: Cross-compile x86_64-linux-gnu (pod runner build)
        run: zig build -Dtarget=x86_64-linux-gnu.2.28 -Doptimize=ReleaseSmall --prefix /tmp/zoxide-gnu

      - name: Cross-compile aarch64-linux-musl (static)
        run: zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall --prefix /tmp/zoxide-musl

      - name: Verify binary shapes
        run: |
          file /tmp/zoxide-gnu/bin/zoxide | grep -q 'dynamically linked'
          file /tmp/zoxide-musl/bin/zoxide | grep -q 'statically linked'

      - name: Downstream package integration
        run: zig build
        working-directory: tests/downstream
      - name: Scaffold integration (zoxide new)
        run: |
          set -euo pipefail
          rm -rf /tmp/scaffold && mkdir -p /tmp/scaffold
          ./zig-out/bin/zoxide new scaffolded --dir /tmp/scaffold/scaffolded --zoxide-path "$PWD"
          cd /tmp/scaffold/scaffolded
          zig build
          zig build ptx
          # The PTX symbol prefix is the root source file's stem, not the build
          # artifact's name. Those differed once and produced a package whose host
          # side could not find its own kernel, with no build error — so assert
          # the generated launch lookup matches the generated entry point.
          entry=$(grep -oh '\.entry [^(]*' zig-out/kernels/*.ptx | sed 's/\.entry //' | head -1)
          want=$(grep -o 'gpu\.symbol("[^"]*", "[^"]*")' main.zig | sed 's/gpu\.symbol("//; s/", "/_$_/; s/")//' | head -1)
          if [ "$entry" != "$want" ]; then
            echo "scaffold: PTX entry '$entry' does not match the symbol main.zig looks up ('$want')"; exit 1
          fi
          echo "scaffold entry point agrees with host lookup: $entry"
          # A generated template that spills is a template bug.
          if grep -q 'st\.local' zig-out/kernels/*.ptx; then echo "scaffold kernel spilled"; exit 1; fi
          # Degrades cleanly with no GPU on the CI runner.
          ./zig-out/bin/scaffolded

      - name: doctor degrades gracefully without GPU
        run: ./zig-out/bin/zoxide doctor
